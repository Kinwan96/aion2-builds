name: Download images
on:
  workflow_dispatch:
  push:
    paths: ["images.txt"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash fetch_images.sh
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add img
          git diff --cached --quiet || git commit -m "Add local image copies"
          git push
